[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlip-mc"
version = "0.1.2"
description = "Monte Carlo Simulations with Machine-Learned Interatomic Potentials"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "MLIP-MC Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["ase", "huggingface_hub"]

[project.optional-dependencies]
dev = ["pytest"]
fairchem = ["fairchem-core"]
mace-torch = ["mace-torch"]
orb-models = ["orb-models"]

[project.scripts]
mlip_mc = "mlip_mc.cli:main"

[project.urls]
Homepage = "https://github.com/jackevansadl/MLIP-MC"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mlip_mc", "mlip_mc.*"]

[tool.setuptools.package-data]
mlip_mc = ["data/*.csv"]
