[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlip-mc"
version = "0.1.0"
description = "Monte Carlo Simulations with Machine-Learned Interatomic Potentials"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "MLIP-MC Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]
dependencies = ["molmod==1.4.8", "numpy==1.26.4", "Cython==0.29.37", "nequip==0.5.6", "torch==1.12.1", "e3nn==0.4.4"] 

[project.optional-dependencies]
dev = ["pytest"]
fairchem = ["fairchem-core"]
mace-torch = ["mace-torch"]

[project.scripts]
mlip_mc = "mlip_mc.cli:main"

[project.urls]
Homepage = "https://github.com/jackevansadl/MLIP-MC"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mlip_mc", "mlip_mc.*"]

[tool.setuptools.package-data]
mlip_mc = ["data/*.csv"]
